[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strawberryremote"
version = "0.1.0"
description = "Control Strawberry music player from a phone browser on the same network (MPRIS over D-Bus)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
strawberryremote = "strawberryremote.server:main"

[tool.setuptools]
packages = ["strawberryremote"]
include-package-data = true

[tool.setuptools.package-data]
strawberryremote = ["index.html", "login.html"]
